name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Check out code
        uses: actions/checkout@v4

      - name: Tidy modules
        run: go mod tidy

      - name: Run tests
        run: go test ./... -v

      - name: Run golangci-lint
        uses: golangci-lint-action@v3
        with:
          version: v1.55.2
